[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-subnet-wizard"
version = "0.2.0rc1"
description = "phpIPAM-style splitting and reservation of child prefixes in NetBox"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["netbox_subnet_wizard*"]
exclude = ["netbox_subnet_wizard.tests*"]

[tool.setuptools.package-data]
netbox_subnet_wizard = ["templates/netbox_subnet_wizard/*.html"]
